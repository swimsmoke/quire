name: keepalive

# The API runs on a free host that sleeps when idle. This keeps the public demo
# responsive during judging by requesting it every 10 minutes.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the API and the site
        run: |
          curl -fsS --max-time 120 --retry 3 --retry-delay 10 https://quire-api-0tkm.onrender.com/health
          echo
          curl -fsS --max-time 60 -o /dev/null -w "site %{http_code}\n" https://quire-gamma.vercel.app/
